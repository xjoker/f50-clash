name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      HOST_TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: 检出完整历史
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 准备锁定的 Rust 工具链
        run: rustup target add "${HOST_TARGET}" --toolchain 1.95.0
      - name: Clippy
        run: cargo clippy --locked --target "${HOST_TARGET}" --all-targets -- -D warnings
      - name: Rust 测试
        run: cargo test --locked --target "${HOST_TARGET}" -- --test-threads=1
      - name: Shell 契约
        run: |
          bash tests/version-contract.sh
          bash tests/easytier-pin.sh
          bash tests/migration-contract.sh
          bash tests/release-build-contract.sh
          bash tests/open-source-contract.sh
      - name: 完整 Git 历史密钥扫描
        run: scripts/ci-secret-scan.sh
