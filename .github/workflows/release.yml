name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  osv:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --lockfile=./Cargo.lock
    permissions:
      contents: read
      actions: read
      security-events: write

  rustsec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 检出依赖锁文件
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: 安装锁定的 RustSec 审计工具
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: 拒绝漏洞、不安全、未维护和 yanked 依赖
        run: cargo audit --deny warnings

  build:
    needs: [osv, rustsec]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      HOST_TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: 检出标签和完整历史
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 校验标签与 VERSION
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          EXPECTED_TAG="v${VERSION}"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_TAG}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
      - name: 准备锁定的 Rust 工具链
        run: rustup target add "${HOST_TARGET}" --toolchain 1.95.0
      - name: 发布前测试
        run: |
          cargo clippy --locked --target "${HOST_TARGET}" --all-targets -- -D warnings
          cargo test --locked --target "${HOST_TARGET}" -- --test-threads=1
          bash tests/version-contract.sh
          bash tests/easytier-pin.sh
          bash tests/migration-contract.sh
          bash tests/release-build-contract.sh
          bash tests/open-source-contract.sh
      - name: 完整 Git 历史密钥扫描
        run: scripts/ci-secret-scan.sh
      - name: 构建 Android 制品
        run: ./build.sh
      - name: 获取 GPL/LGPL 对应源码
        run: scripts/fetch-assets.sh --source-offers release
      - name: 扫描实际 Release 归档
        run: scripts/ci-secret-scan.sh "release/f50mgr-${VERSION}.zip"
      - name: 生成 SPDX JSON SBOM
        run: scripts/generate-sbom.sh \
          "release/f50mgr-${VERSION}.zip" \
          "release/f50mgr-${VERSION}.spdx.json"
      - name: 校验待发布文件
        run: |
          test -s "release/f50mgr-${VERSION}.spdx.json"
          (cd release && sha256sum -c "f50mgr-${VERSION}.zip.sha256")
          (cd release && sha256sum -c third-party-sources.sha256)
      - name: 保存只读构建产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            release/f50mgr-${{ env.VERSION }}.zip
            release/f50mgr-${{ env.VERSION }}.zip.sha256
            release/f50mgr-${{ env.VERSION }}.spdx.json
            release/*-source.tar.gz
            release/third-party-sources.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 下载已验证的构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          (cd release && sha256sum -c "f50mgr-${VERSION}.zip.sha256")
          (cd release && sha256sum -c third-party-sources.sha256)
          gh release create "${GITHUB_REF_NAME}" \
            "release/f50mgr-${VERSION}.zip" \
            "release/f50mgr-${VERSION}.zip.sha256" \
            "release/f50mgr-${VERSION}.spdx.json" \
            release/*-source.tar.gz \
            release/third-party-sources.sha256 \
            --verify-tag \
            --title "f50mgr ${VERSION}" \
            --generate-notes
