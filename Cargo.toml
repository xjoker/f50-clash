[workspace]
members = ["."]
resolver = "2"

[package]
name = "f50mgr"
version = "20260720.1.0"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "f50mgr"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
base64 = { version = "0.22", default-features = false, features = ["std"] }
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = { package = "serde_norway", version = "=0.9.42" }
sha2 = "=0.11.0"
tokio = { version = "1.49", features = ["io-util", "macros", "net", "rt-multi-thread", "process", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
tower = "0.5"

[build-dependencies]
oxc = { version = "=0.140.0", features = ["codegen", "minifier"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
